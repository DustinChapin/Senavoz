<main class="split">
  <!-- Mitad superior: persona oyente (rotada 180° para quedar de frente a ella) -->
  <section class="zone hearing rotated" aria-label="Zona de la persona oyente">
    <p class="role">Persona oyente</p>
    <button type="button" class="mic" [class.on]="listening()" (click)="toggleListening()"
      [attr.aria-pressed]="listening()">
      <span class="mic-icon">{{ listening() ? '⏹' : '🎤' }}</span>
      <span>{{ listening() ? 'Cancelar' : 'Toca para hablar' }}</span>
    </button>
    <div class="status" [class.live]="listening()" [class.done]="finished() && !listening()" aria-live="polite">
      @if (listening()) {
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>Habla ahora</span>
      } @else if (finished()) {
        <span>✔ Listo, tu mensaje se envió</span>
      } @else {
        <span>Toca el botón y luego habla</span>
      }
    </div>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </section>

  <!-- Mitad inferior: persona sorda -->
  <section class="zone deaf" aria-label="Zona de la persona sorda">
    <div class="stage" aria-live="polite">
      <p class="transcript" [class.empty]="!transcript()">
        {{ transcript() || 'Lo que diga la otra persona se mostrará aquí' }}
      </p>
    </div>

    <form class="compose" (submit)="$event.preventDefault(); speakDraft()">
      <input type="text" class="compose-input" placeholder="Escribe aquí para que la app lo diga en voz alta"
        enterkeyhint="send" autocomplete="off" aria-label="Mensaje para leer en voz alta"
        [value]="draft()" (input)="onDraft($event)" />
      <button type="submit" class="compose-btn" [disabled]="!draft().trim() || speakingDraft()">
        {{ speakingDraft() ? '…' : '🔊 Decir' }}
      </button>
    </form>

    <div class="cards">
      @for (p of phrases(); track p.id) {
        <button type="button" class="card" [class.speaking]="speakingId() === p.id" (click)="say(p)">
          <span class="card-icon" aria-hidden="true">{{ icon(p.icon_name) }}</span>
          <span class="card-text">{{ p.display_text }}</span>
        </button>
      }
    </div>
  </section>
</main>
